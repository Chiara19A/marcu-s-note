name: Build IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Configurazione build"
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build:
    name: Compila IPA per iPadOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleziona Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true

      - name: Compila .app per iOS/iPadOS
        env:
          CONFIG: ${{ inputs.configuration || 'Release' }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project MarcussNote/MarcusNote.xcodeproj \
            -scheme MarcussNote \
            -configuration "$CONFIG" \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Impacchetta IPA
        env:
          CONFIG: ${{ inputs.configuration || 'Release' }}
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "Trovata app in: $APP_PATH"
          
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r "../MarcusNote-$CONFIG.ipa" Payload
          cd ..
          ls -la *.ipa

      - name: Pubblica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: MarcussNote-IPA
          path: "*.ipa"
          if-no-files-found: error
