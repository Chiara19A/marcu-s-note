name: Build IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Configurazione build"
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build:
    name: Compila IPA per iPadOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleziona Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true

      - name: Ambiente
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Swift: $(swift --version | head -1)"

      - name: Trova Scheme e compila Archive
        env:
          CONFIG: ${{ inputs.configuration || 'Release' }}
        run: |
          mkdir -p build
          set -o pipefail
          
          # Estrae automaticamente il primo scheme disponibile nel progetto
          SCHEME=$(xcodebuild -list -project MarcussNote/MarcusNote.xcodeproj | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' | xargs | awk '{print $1}')
          echo "Scheme rilevato: $SCHEME"
          
          if [ -z "$SCHEME" ]; then
            echo "Nessuno scheme condiviso trovato. Uso il fallback MarcussNote."
            SCHEME="MarcussNote"
          fi

          xcodebuild archive \
            -project MarcussNote/MarcusNote.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath build/MarcusNote.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee build/archive.log

      - name: Export IPA non firmato
        run: |
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/MarcusNote.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist MarcussNote/ExportOptions.plist \
            2>&1 | tee build/export.log

      - name: Carica IPA
        env:
          CONFIG: ${{ inputs.configuration || 'Release' }}
        run: |
          cp "$(ls build/export/*.ipa | head -1)" "MarcusNote-$CONFIG.ipa"
          ls -la *.ipa

      - name: Pubblica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: MarcussNote-IPA
          path: "*.ipa"
          if-no-files-found: error
