name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila IPA per iPadOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true

      - name: Compila il progetto
        run: |
          set -o pipefail
          xcodebuild build \
            -project MarcussNote/MarcusNote.xcodeproj \
            -scheme MarcussNote \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Pacchetto IPA
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/DerivedData -name "*.app" -type d | head -1)
          
          if [ -z "$APP_DIR" ]; then
            echo "Errore: applicazione non trovata."
            exit 1
          fi

          echo "App trovata in: $APP_DIR"
          cp -R "$APP_DIR" build/Payload/
          cd build
          zip -r "../MarcussNote.ipa" Payload
          cd ..
          ls -la *.ipa

      - name: Upload Artefatto IPA
        uses: actions/upload-artifact@v4
        with:
          name: MarcussNote-IPA
          path: "*.ipa"
          if-no-files-found: error
